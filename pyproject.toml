[project]
name = "asap"
version = "0.1.0"
description = "Active Safe-Agentic Pipeline (ASAP): Agnostic Runtime Safety and Guardrail Framework for Software Engineering Agents"
readme = "README.md"
authors = [
    { name = "Franco Ariel Demare", email = "frandemare@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.4",
    "numpy>=2.4.6",
    "torch>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
